<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00A36C">
<title>Good.2.eat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --paper:#F3FAF6; --surface:#FFFFFF; --ink:#0F241A; --muted:#4D6257; --line:#D3E5DA;
  --brand:#00A36C; --on-brand:#FFFFFF;
  --violet:#6A3DF0; --violet-bg:#EEE8FF;
  --c0:#E0234E; --c1:#FF6B00; --c2:#FFC400; --c3:#12B76A;
  --hi-bg:#FFE3E8; --mid-bg:#FFF0D2; --lo-bg:#DBF6E8;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0B1611; --surface:#132119; --ink:#EAF3EE; --muted:#9BB0A4; --line:#25392E;
    --brand:#14C47F; --on-brand:#04130C;
    --violet:#9B7BFF; --violet-bg:#231B42;
    --hi-bg:#41162A; --mid-bg:#3D2A0A; --lo-bg:#0E3424;
  }
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.appbar{background:var(--brand);color:var(--on-brand);padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 22px}
.appbar-in{max-width:560px;margin:0 auto}
.brand{font-family:var(--display);font-weight:800;font-size:31px;letter-spacing:-.02em;margin:0;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:15px;opacity:.92;margin-top:4px;letter-spacing:0}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 120px}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:26px 0 10px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.view{display:none}.view.on{display:block}

.pill{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:999px;padding:8px 15px;background:var(--violet-bg);color:var(--violet);font-weight:700;font-size:15px;cursor:pointer;margin-bottom:14px;max-width:100%;text-align:left}
.pill::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--violet);flex:none}
.pill.off{background:var(--surface);color:var(--muted);border:2px dashed var(--line)}
.pill.off::before{background:var(--line)}

.scanbox{position:relative;background:#0A1A12;border-radius:24px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;border:3px solid var(--brand)}
#reader{width:100%;height:100%}
#reader video{object-fit:cover}
.scan-idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#D9F7E8;text-align:center;padding:20px}
.barcode-art{display:flex;gap:3px;height:56px;align-items:stretch}
.barcode-art i{display:block;background:#5CF0A8;border-radius:1px}
.btn{appearance:none;border:0;border-radius:14px;padding:13px 20px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--on-brand);min-height:48px}
.btn.violet{background:var(--violet);color:#fff}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.btn.small{padding:8px 14px;min-height:40px;font-size:15px}
.row{display:flex;gap:10px;margin-top:12px}
.row input{flex:1;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
textarea{width:100%;min-height:120px;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;resize:vertical}
.linkish{white-space:nowrap;background:none;border:0;padding:6px 0;color:var(--brand);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px}

.product{display:flex;gap:14px;align-items:center;margin-top:22px}
.product img{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:14px;border:1px solid var(--line);flex:none}
.product h3{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.2;margin:0}
.product p{margin:2px 0 0;color:var(--muted);font-size:15px}

.score{margin-top:18px;padding:22px 20px 20px;border-radius:24px;background:var(--vc);color:var(--vt)}
.score-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.score-num{font-family:var(--display);font-weight:800;font-size:84px;line-height:.85;letter-spacing:-.04em}
.score-num span{font-size:22px;letter-spacing:0;opacity:.75;font-weight:600}
.verdict{font-family:var(--display);font-weight:800;font-size:23px;text-align:right;line-height:1.15}
.sub{font-size:15px;opacity:.92;margin:10px 0 0}
.meter{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:18px 0 6px;height:12px}
.meter b{border-radius:6px;background:var(--seg)}
.meter b.on{background:var(--segon)}
.pin{position:absolute;top:-6px;width:5px;height:24px;background:var(--vt);border-radius:3px;transform:translateX(-50%);box-shadow:0 0 0 2px var(--vc)}
.meter-labels{display:grid;grid-template-columns:repeat(4,1fr);font-size:13px;opacity:.85}
.meter-labels span:last-child{text-align:right}
.parts{margin-top:16px;display:grid;gap:10px}
.part{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:15px}
.part .bar{grid-column:1/-1;height:6px;background:var(--seg);border-radius:3px;overflow:hidden}
.part .bar i{display:block;height:100%;background:var(--vt)}
.partial{font-size:14px;opacity:.85;margin:12px 0 0}

.alerts{margin-top:16px;display:grid;gap:8px}
.alerts h2{margin:6px 0 2px;color:var(--violet)}
.alert{border-radius:16px;padding:12px 14px 12px 46px;position:relative;font-size:16px}
.alert::before{position:absolute;left:13px;top:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;font-family:var(--display)}
.alert.crit{background:var(--c0);color:#fff;font-weight:700}
.alert.crit::before{content:"!";background:#fff;color:var(--c0)}
.alert.warn{background:var(--mid-bg)}
.alert.warn::before{content:"!";background:var(--c1);color:#fff}
.alert.info{background:var(--violet-bg)}
.alert.info::before{content:"i";background:var(--violet);color:#fff}
.alert.ok{background:var(--lo-bg)}
.alert.ok::before{content:"✓";background:var(--c3);color:#fff}

.lights{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.light{border-radius:16px;padding:10px 12px;font-size:15px;border-left:6px solid transparent}
.light strong{display:block;font-size:20px}
.light.hi{background:var(--hi-bg);border-color:var(--c0)}.light.mid{background:var(--mid-bg);border-color:var(--c1)}.light.lo{background:var(--lo-bg);border-color:var(--c3)}

.add{border-left:6px solid var(--line);background:var(--surface);border-radius:4px 16px 16px 4px;padding:12px 14px;margin-top:8px}
.add.hi{border-color:var(--c0)}.add.mid{border-color:var(--c1)}.add.lo{border-color:var(--c3)}
.add summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.add summary::-webkit-details-marker{display:none}
.add .code{font-weight:700}
.add .lvl{font-size:13px;white-space:nowrap;color:var(--muted)}
.add p{margin:8px 0 0;font-size:15px}
.ban,.me{display:inline-block;color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;margin-left:6px;vertical-align:2px}
.ban{background:var(--c0)}.me{background:var(--violet)}
.empty-ok{background:var(--lo-bg);border-radius:16px;padding:14px 16px;margin-top:8px}

details.ingr{margin-top:14px}
details.ingr summary{cursor:pointer;font-weight:700;color:var(--brand)}
details.ingr p{font-size:15px;color:var(--muted)}
.foot{font-size:13px;color:var(--muted);margin-top:22px;line-height:1.45}
.foot a{color:var(--brand)}

.hist{display:grid;gap:8px}
.hitem{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.hitem img,.hitem .ph{width:44px;height:44px;border-radius:10px;object-fit:contain;flex:none;background:#fff}
.hitem .t{flex:1;min-width:0}
.hitem .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .t span{font-size:14px;color:var(--muted)}
.badge{font-family:var(--display);font-weight:800;font-size:18px;min-width:52px;text-align:center;border-radius:12px;padding:6px 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.chips.al .chip[aria-pressed="true"]{border-color:var(--violet);background:var(--violet);color:#fff}
.search{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.count{font-size:14px;color:var(--muted);margin:8px 0}

.group{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px;margin-top:10px}
.tog{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tog:last-child{border-bottom:0}
.tog span{flex:1}
.tog small{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:2px}
.tog input{appearance:none;-webkit-appearance:none;margin:0;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog input:checked{background:var(--violet)}
.tog input:checked::after{transform:translateX(20px)}
.private{font-size:14px;color:var(--muted);margin-top:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs button{flex:1;max-width:140px;background:none;border:0;padding:10px 4px 12px;cursor:pointer;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:inset 0 3px 0 transparent}
nav.tabs button[aria-current="page"]{color:var(--brand);font-weight:700;box-shadow:inset 0 3px 0 var(--brand)}
nav.tabs button[data-v="v-prof"][aria-current="page"]{color:var(--violet);box-shadow:inset 0 3px 0 var(--violet)}
nav.tabs svg{width:24px;height:24px}
.spinner{width:30px;height:30px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}.tog input,.tog input::after{transition:none}}
.alt{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0;line-height:1.4}
#ocrBox{margin-top:12px}
.ocr-status{background:var(--violet-bg);color:var(--ink);border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:15px}
.ocr-status .bar{height:6px;background:var(--surface);border-radius:3px;margin-top:8px;overflow:hidden}
.ocr-status .bar i{display:block;height:100%;background:var(--violet);transition:width .2s}
.ocr-status.err{background:var(--hi-bg)}
h3.sub-h{font-family:var(--display);font-weight:600;font-size:18px;margin:22px 0 8px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg button{flex:1 1 auto;border:0;background:none;border-radius:12px;padding:10px 10px;cursor:pointer;font-size:15px;min-width:72px}
.seg button[aria-checked="true"]{background:var(--violet);color:#fff;font-weight:700}
.method{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:4px 0 14px}
.method summary{cursor:pointer;font-weight:700;color:var(--brand)}
.method p{font-size:15px;margin:10px 0 0}
.method a{color:var(--brand)}
.add .eu{font-size:13px;color:var(--muted);margin-top:6px}
.trust{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;background:var(--lo-bg);border-radius:14px;padding:10px 14px;margin-top:4px;font-size:14px}
.trust .linkish{padding:0;font-size:14px}
.portion{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px}
.portion-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.portion-row input{width:92px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--paper)}
.qbtn{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.qbtn[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
table.nt{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
.nt td{padding:7px 0;border-bottom:1px solid var(--line)}
.nt td:nth-child(2){text-align:right;font-weight:700}
.nt td:nth-child(3){text-align:right;color:var(--muted);width:64px}
.nt tr.subrow td:first-child{padding-left:14px;color:var(--muted)}
.nt tr:last-child td{border-bottom:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.internal{border-left:6px solid var(--violet)}
.btn.ghost[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
#photoCode{display:block;margin-top:6px}
#sportSeg{display:grid;grid-template-columns:1fr 1fr}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tagline{margin:4px 0 0;font-size:15px;opacity:.92}
.lang{display:flex;background:rgba(255,255,255,.18);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:var(--on-brand);font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--on-brand);color:var(--brand)}
</style>
</head>
<body>
<header class="appbar"><div class="appbar-in">
  <div class="brandrow">
    <h1 class="brand">Good.2.eat</h1>
    <div class="lang" role="group" aria-label="Language / Limbă">
      <button data-lang="ro" aria-pressed="false">RO</button><button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <p class="tagline" data-i18n="tagline"></p>
</div></header>
<div class="wrap">

  <section id="v-scan" class="view on">
    <button class="pill off" id="profPill"></button>
    <div class="scanbox">
      <div id="reader"></div>
      <div class="scan-idle" id="idle">
        <div class="barcode-art" aria-hidden="true"></div>
        <button class="btn" id="startBtn" data-i18n="startCam"></button>
      </div>
    </div>
    <div id="stopRow" hidden>
      <div class="row">
        <button class="btn ghost small" id="stopBtn" data-i18n="stopCam"></button>
        <button class="btn ghost small" id="torchBtn" hidden aria-pressed="false" data-i18n="torch"></button>
        <button class="btn ghost small" id="zoomBtn" hidden aria-pressed="false" data-i18n="zoom"></button>
      </div>
      <p class="hint" id="scanHint"></p>
    </div>
    <button class="linkish" id="photoCode" data-i18n="photoCode"></button>
    <input type="file" id="codeFile" accept="image/*" capture="environment" hidden>
    <form class="row" id="manualForm" autocomplete="off">
      <input id="manualCode" inputmode="numeric" pattern="[0-9]*" data-i18n-ph="codePh" data-i18n-aria="codeAria">
      <button class="btn" type="submit" data-i18n="search"></button>
    </form>
    <div class="alt">
      <button class="btn violet" id="ocrBtn" data-i18n="ocrBtn"></button>
      <button class="linkish" id="typeToggle" data-i18n="typeIt"></button>
    </div>
    <input type="file" id="ocrFile" accept="image/*" capture="environment" hidden>
    <div id="ocrBox" hidden>
      <div id="ocrStatus" class="ocr-status" hidden></div>
      <textarea id="pasteText" data-i18n-ph="pastePh" data-i18n-aria="pasteAria"></textarea>
      <p class="hint" data-i18n="ocrHint"></p>
      <div class="row"><button class="btn" id="pasteBtn" data-i18n="analyse"></button><button class="btn ghost small" id="ocrAgain" data-i18n="anotherPhoto"></button></div>
    </div>
    <div id="result" aria-live="polite"></div>
  </section>

  <section id="v-hist" class="view">
    <h2 data-i18n="histTitle"></h2>
    <div id="histList" class="hist"></div>
  </section>

  <section id="v-add" class="view">
    <h2 data-i18n="addTitle"></h2>
    <details class="method" id="method">
      <summary data-i18n="method"></summary>
      <p data-i18n="m1"></p>
      <p data-i18n="m2"></p>
      <p data-i18n="m3"></p>
      <p data-i18n="m4"></p>
      <p><a href="https://food.ec.europa.eu/food-safety/food-improvement-agents/additives/database_en" target="_blank" rel="noopener" data-i18n="mLink1"></a><br><a href="https://www.efsa.europa.eu/en/topics/topic/food-additives" target="_blank" rel="noopener" data-i18n="mLink2"></a></p>
    </details>
    <input class="search" id="addSearch" data-i18n-ph="addSearchPh" data-i18n-aria="addSearchAria">
    <div class="chips" role="group" data-i18n-aria="filterAria">
      <button class="chip" data-f="all" aria-pressed="true" data-i18n="fAll"></button>
      <button class="chip" data-f="3" aria-pressed="false" data-i18n="lvl3"></button>
      <button class="chip" data-f="2" aria-pressed="false" data-i18n="lvl2"></button>
      <button class="chip" data-f="1" aria-pressed="false" data-i18n="lvl1"></button>
    </div>
    <div class="count" id="addCount"></div>
    <div id="addList"></div>
  </section>

  <section id="v-prof" class="view">
    <h2 data-i18n="profTitle"></h2>
    <p class="muted" style="margin-top:0;font-size:15px" data-i18n="profLead"></p>
    <h3 class="sub-h" data-i18n="kidH"></h3>
    <div class="seg" id="kidSeg" role="radiogroup" data-i18n-aria="kidAria"></div>
    <p class="hint" data-i18n="kidHint"></p>
    <h3 class="sub-h" data-i18n="sportH"></h3>
    <div class="seg" id="sportSeg" role="radiogroup" data-i18n-aria="sportAria"></div>
    <p class="hint" data-i18n="sportHint"></p>
    <h3 class="sub-h" data-i18n="condH"></h3>
    <div class="group" id="condList"></div>
    <h3 class="sub-h" data-i18n="allH"></h3>
    <p class="hint" style="margin-top:0" data-i18n="allHint"></p>
    <div class="chips al" id="allergenList"></div>
    <p class="private" data-i18n="private"></p>
    <div class="row"><button class="btn violet" id="profDone" data-i18n="profDone"></button><button class="btn ghost small" id="profReset" data-i18n="profReset"></button></div>
  </section>
</div>

<nav class="tabs" data-i18n-aria="navAria">
  <button data-v="v-scan" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v8"/></svg><span data-i18n="navScan"></span></button>
  <button data-v="v-hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span data-i18n="navHist"></span></button>
  <button data-v="v-prof"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-i18n="navProf"></span></button>
  <button data-v="v-add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span data-i18n="navAdd"></span></button>
</nav>

<script>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const num = (n,k) => n && n[k] !== undefined && n[k] !== "" && n[k] !== null && !isNaN(+n[k]) ? +n[k] : null;
const fmt = v => (+v).toLocaleString(LOCALE(),{maximumFractionDigits:1});

function lookup(raw){
  let c = String(raw).toUpperCase().replace(/[\s\-.]/g,"");
  if(!c.startsWith("E")) c = "E"+c;
  if(MAP[c]) return MAP[c];
  const r = c.replace(/(IV|III|II|I)$/,"");
  if(r !== c && MAP[r]) return MAP[r];
  const d = (c.match(/^E\d+/)||[])[0];
  if(d && MAP[d]) return MAP[d];
  return {c:d||c, l:0, t:"", u:1};
}
function extractFromText(text){
  const found = new Map();
  const re = /\bE[\s-]?(\d{3,4})([a-d])?(?![0-9])/gi;
  let m;
  while((m = re.exec(text))){ const a = lookup("E"+m[1]+(m[2]||"")); found.set(a.c, a); }
  const tx = " "+norm(text)+" ";
  DB.forEach(a => (a.k||[]).forEach(k => {
    let i = tx.indexOf(k);
    while(i > -1){
      if(!/[a-z0-9]/.test(tx[i-1])){ found.set(a.c, a); break; }
      i = tx.indexOf(k, i+1);
    }
  }));
  return [...found.values()];
}
function fromTags(tags){
  const found = new Map();
  (tags||[]).forEach(x => { const a = lookup(x.replace(/^[a-z]{2}:/,"")); found.set(a.c, a); });
  return [...found.values()];
}
function mergeAdds(a, b){ const m = new Map(); [...a,...b].forEach(x => { if(!m.has(x.c)) m.set(x.c,x); }); return [...m.values()]; }
function fixOcr(s){
  return s.replace(/-\s*\n\s*/g,"").replace(/\s*\n\s*/g," ")
    .replace(/\b([Ee])[\s-]?([0-9OoIlS]{3,4})(?=[a-dA-D]?(?![0-9A-Za-z]))/g, (m,e,d) =>
      d.replace(/\D/g,"").length >= 2 ? "E"+d.replace(/[Oo]/g,"0").replace(/[Il]/g,"1").replace(/S/g,"5") : m)
    .replace(/\s{2,}/g," ").trim();
}

const NS = {a:100,b:78,c:55,d:30,e:10};
const NV = {1:100,2:85,3:55,4:20};
function computeScore(p, adds){
  const parts = [];
  const ns = (p.nutriscore_grade||"").toLowerCase();
  if(NS[ns] !== undefined) parts.push({label:t("pNutri",{g:ns.toUpperCase()}), val:NS[ns], w:.5});
  if(adds){
    let pen = adds.reduce((s,a) => s + LEVEL[a.l].pen, 0);
    if(adds.some(a => a.b)) pen += 25;
    const nr = adds.filter(a => a.l >= 2).length;
    parts.push({label: nr ? t("pAdd",{n:nr}) : t("pAddNone"), val:Math.max(0,100-pen), w:.3});
  }
  const nv = +p.nova_group;
  if(NV[nv]) parts.push({label:t("pNova",{n:nv}), val:NV[nv], w:.2});
  if(!parts.length) return null;
  const W = parts.reduce((s,x) => s+x.w, 0);
  return {score:Math.round(parts.reduce((s,x) => s + x.val*x.w, 0)/W), parts, partial:parts.length < 3};
}

const CONDS = ["preg","pku","gout","bp","diab","vegan"];

const SPORT_OPTS = [["","kNo"],["muscle","sMuscle"],["endurance","sEnd"],["weight","sWeight"]];
const CAF = /\b(cafein|cafea\b|guarana|extract de ceai|ceai negru|ceai verde|caffeine|coffee|tea extract|black tea|green tea)/;
const ALC = /\b(alcool|etanol|vin\b|bere\b|lichior|coniac|vodca|whiske?y|rom\b|alcohol|ethanol|wine\b|beer\b|liqueur|brandy|vodka|rum\b)/;
const VEG = /\b(lapte|lactoz|smantan|unt\b(?! de (cacao|arahide|shea))|branz|zer\b|cazein|iaurt|oua?\b|miere|gelatin|carne|porc|vita\b|pui\b|peste|colagen|untura|slanina|sunca|milk|lactose|cream\b|(?<!(cocoa|peanut|shea|nut) )butter|cheese|whey|casein|eggs?\b|honey|meat|pork|beef|chicken|fish\b|collagen|lard|bacon|ham\b)/;
const SUGAR_TXT = /\b(zahar|sirop de|dextroz|glucoz|fructoz|miere|zaharoz|sugar|syrup|dextrose|glucose|fructose|honey|sucrose)/;
const HONEY = /\b(miere|honey)/, QUININE = /\b(chinin|quinine)/, FRUCT = /(fructoz|fructose|sirop de porumb|corn syrup)/, PHE = /(fenilalanin|phenylalanine)/;
const SULF_CODES = ["E220","E221","E222","E223","E224","E226","E227","E228"];
const POLYOLS = ["E420","E421","E953","E965","E966","E967","E968"];

function getProfile(){
  let P; try{ P = JSON.parse(localStorage.getItem(PK)) || {}; }catch(e){ P = {}; }
  if(P.kids && P.kidAge === undefined) P.kidAge = "3";
  delete P.kids;
  P.allergens = P.allergens || []; P.kidAge = P.kidAge || ""; P.sport = P.sport || "";
  return P;
}
function setProfile(p){ try{ localStorage.setItem(PK, JSON.stringify(p)); }catch(e){} }
function profileLabels(P){
  const out = [];
  if(P.kidAge) out.push(t("kidLabel",{age:t(KID_OPTS.find(o => o[0]===P.kidAge)[1]).toLowerCase()}));
  if(P.sport) out.push(t(SPORT_OPTS.find(o => o[0]===P.sport)[1]));
  CONDS.forEach(c => { if(P[c]) out.push(t("c_"+c+"_s")); });
  P.allergens.forEach(id => { const a = ALLERGENS.find(x => x[0]===id); if(a) out.push(t(a[1])); });
  return out;
}
function splitTraces(s){ const i = s.search(/(poate contine|urme de|may contain|traces of)/); return i < 0 ? [s,""] : [s.slice(0,i), s.slice(i)]; }

function personalize(ctx, grams){
  const P = getProfile();
  const g = grams || 100;
  const out = {alerts:[], pen:0, crit:false, mine:new Set(), active:profileLabels(P).length > 0};
  if(!out.active) return out;
  const adds = ctx.adds || [];
  const has = c => adds.some(a => a.c === c);
  const n = ctx.nutr;
  const v100 = k => num(n,k);
  const per = k => { const v = num(n,k); return v === null ? null : v*g/100; };
  const [main, traces] = splitTraces(ctx.text || "");
  const add = (lvl, key, vars={}, pen=0, codes=[]) => { out.alerts.push({lvl, t:t(key, vars)}); out.pen += pen; if(lvl==="crit") out.crit = true; codes.forEach(c => out.mine.add(c)); };

  P.allergens.forEach(id => {
    const A = ALLERGENS.find(x => x[0] === id); if(!A) return;
    const sc = id.startsWith("sulphur") ? SULF_CODES.filter(has) : [];
    const inside = (ctx.allergens||[]).includes("en:"+id) || A[2].test(main) || sc.length > 0;
    const trace = (ctx.traces||[]).includes("en:"+id) || A[2].test(traces);
    const x = t(A[1]).toLowerCase();
    if(inside) add("crit","a_allergy",{x},0,sc);
    else if(trace) add("warn","a_trace",{x},20);
  });

  if(P.pku){
    const A = ["E951","E962"].filter(has);
    if(A.length || PHE.test(main)) add("crit","a_pku",{},0,A);
  }

  if(P.kidAge){
    const young = P.kidAge === "0" || P.kidAge === "1";
    if(P.kidAge === "0" && HONEY.test(main)) add("crit","a_honey");
    const S = ["E102","E104","E110","E122","E124","E129"].filter(has);
    if(S.length) add("warn","a_south",{c:S.join(", ")},15*S.length,S);
    const B = ["E210","E211","E212","E213"].filter(has);
    if(B.length) add("warn","a_benz",{c:B.join(", ")},10,B);
    const SW = adds.filter(a => a.t === "Îndulcitor" && a.l >= 2).map(a => a.c);
    if(SW.length) young ? add("warn","a_sweetYoung",{c:SW.join(", ")},25,SW) : add("warn","a_sweetKid",{c:SW.join(", ")},10,SW);
    if(CAF.test(main)) add("warn","a_cafKid",{}, young ? 30 : 20);
    const s100 = v100("sugars_100g");
    if(young){
      if(SUGAR_TXT.test(main) || (s100 !== null && s100 > 5)) add("warn","a_sugarYoung",{},20);
      const salt = v100("salt_100g");
      if(salt !== null && salt > 0.3) add("warn","a_saltYoung",{s:fmt(salt)},15);
    } else if(s100 !== null && s100 > 12.5) add("warn","a_sugarKid",{s:fmt(s100)},10);
    const sp = per("sugars_100g");
    if(sp !== null && sp >= 1) add("info","a_tsp",{n:fmt(sp/4), g:fmt(g)});
  }

  if(P.sport){
    const kcal = v100("energy-kcal_100g"), prot = v100("proteins_100g"), fib = v100("fiber_100g");
    const POL = POLYOLS.filter(has);
    if(POL.length) add("warn","a_polyol",{c:POL.join(", ")},5,POL);
    if(P.sport === "muscle" && prot !== null){
      const pp = t("a_protPer",{p:fmt(per("proteins_100g")), g:fmt(g)});
      if(kcal){
        const d = prot/kcal*100;
        if(d >= 10) add("ok","a_protGood",{d:fmt(d), pp},-10);
        else if(d >= 5) add("info","a_protMid",{d:fmt(d), pp});
        else add("warn","a_protLow",{d:fmt(d), pp},5);
      } else out.alerts.push({lvl:"info", t:pp});
    }
    if(P.sport === "endurance"){
      const c = per("carbohydrates_100g"), su = per("sugars_100g");
      if(c !== null) add("info","a_carbs",{c:fmt(c), g:fmt(g), s: su !== null ? t("a_carbsSug",{s:fmt(su)}) : ""});
      if(fib !== null && fib > 6) add("info","a_fibreEnd");
      const fat = v100("fat_100g");
      if(fat !== null && fat > 17.5) add("info","a_fatEnd");
    }
    if(P.sport === "weight"){
      if(kcal !== null){
        add("info","a_kcal",{k:Math.round(kcal*g/100), g:fmt(g)});
        if(kcal > 400) add("warn","a_kcalHigh",{k:Math.round(kcal)},10);
      }
      if(fib !== null && fib >= 6) add("ok","a_fibreOk",{},-5);
      if(prot !== null && kcal && prot*4/kcal >= 0.12) add("ok","a_protOk",{},-5);
      const s = v100("sugars_100g");
      if(s !== null && s > 22.5) add("warn","a_sugarHigh",{s:fmt(s)},10);
    }
  }

  if(P.preg){
    const N = ["E249","E250","E251","E252"].filter(has);
    if(N.length) add("warn","a_pregNit",{c:N.join(", ")},15,N);
    if(CAF.test(main)) add("warn","a_pregCaf",{},10);
    if(QUININE.test(main)) add("warn","a_quinine",{},15);
    if(ALC.test(main)) add("warn","a_alcohol",{},20);
  }
  if(P.gout){
    const R = ["E627","E631","E635"].filter(has);
    if(R.length) add("warn","a_goutRib",{c:R.join(", ")},15,R);
    if(FRUCT.test(main)) add("warn","a_goutFru",{},15);
  }
  if(P.bp){
    const s = v100("salt_100g");
    if(s !== null){
      if(s > 1.5) add("warn","a_bpHigh",{s:fmt(s)},25);
      else if(s > 0.6) add("warn","a_bpMid",{s:fmt(s)},10);
    }
    const G = adds.filter(a => /^E62[0-5]$/.test(a.c)).map(a => a.c);
    if(G.length) add("info","a_glut",{c:G.join(", ")},5,G);
  }
  if(P.diab){
    const s = v100("sugars_100g");
    if(s !== null){
      if(s > 22.5) add("warn","a_diabHigh",{s:fmt(s)},25);
      else if(s > 5) add("warn","a_diabMid",{s:fmt(s)},10);
    } else if(SUGAR_TXT.test(main)) add("info","a_diabTxt",{},5);
  }
  if(P.vegan){
    const AN = ["E120","E901","E904","E966","E1105"].filter(has);
    const tags = ctx.analysis || [];
    if(tags.includes("en:non-vegan") || VEG.test(main) || AN.length) add("info","a_notVegan",{x: AN.length ? t("a_notVeganCodes",{c:AN.join(", ")}) : ""},0,AN);
    else if(tags.includes("en:vegan")) add("ok","a_vegan");
  }
  return out;
}

}
const NT = [["energy-kcal_100g","n_energy","kcal",2000],["fat_100g","n_fat","g",70],["saturated-fat_100g","n_satSub","g",20,1],
  ["carbohydrates_100g","n_carbs","g",260],["sugars_100g","n_sugSub","g",90,1],["fiber_100g","n_fibre","g",0],
  ["proteins_100g","n_protein","g",50],["salt_100g","n_salt","g",6]];
function ntTable(n, g){
  const rows = NT.filter(([k]) => num(n,k) !== null).map(([k,l,u,ri,sub]) => {
    const v = num(n,k)*g/100;
    const shown = u === "kcal" ? Math.round(v)+" kcal" : fmt(v)+" g";
    return `<tr class="${sub?'subrow':''}"><td>${esc(t(l))}</td><td>${shown}</td><td>${ri ? Math.round(v/ri*100)+"% RI" : ""}</td></tr>`;
  }).join("");
  return `<table class="nt">${rows}</table>`;
}
function portionBlock(p, g){
  const n = p.nutriments;
  if(!n || !NT.some(([k]) => num(n,k) !== null)) return "";
  const opts = [["100 g",100]];
  if(+p.serving_quantity > 0) opts.push([t("oneServing",{g:fmt(+p.serving_quantity)}), +p.serving_quantity]);
  if(+p.product_quantity > 0 && +p.product_quantity !== +p.serving_quantity) opts.push([t("wholePack",{g:fmt(+p.product_quantity)}), +p.product_quantity]);
  return `<h2>${esc(t("portionH"))}</h2>
  <div class="portion">
    <div class="portion-row">
      <label class="sr" for="grams">${esc(t("gramsAria"))}</label>
      <input id="grams" type="number" inputmode="decimal" min="1" step="any" value="${g}"><span>g</span>
      ${opts.map(([l,v]) => `<button class="qbtn" data-g="${v}" aria-pressed="${v===g}">${esc(l)}</button>`).join("")}
    </div>
    <div id="ntBox">${ntTable(n, g)}</div>
    <p class="hint">${esc(t("riHint"))}</p>
  </div>`;
}

let cur = {ctx:null, g:100};
function updatePortion(g, fromInput){
  if(!(g > 0) || !cur.ctx) return;
  cur.g = g;
  if($("#ntBox")) $("#ntBox").innerHTML = ntTable(cur.ctx.nutr, g);
  const box = $("#alertsBox"); if(box) box.outerHTML = alertsBlock(personalize(cur.ctx, g));
  document.querySelectorAll(".qbtn").forEach(b => b.setAttribute("aria-pressed", +b.dataset.g === g));
  if(!fromInput && $("#grams")) $("#grams").value = g;
}

const OFF_LINK = `<a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a>`;
const FOOT = () => `<p class="foot">${esc(t("foot")).replace("{link}", OFF_LINK)}</p>`;

let lastRender = null;
function renderProduct(code, p, quiet){
  lastRender = () => renderProduct(code, p, true);
  const name = (LANG === "en" ? p.product_name_en || p.product_name || p.product_name_ro : p.product_name_ro || p.product_name || p.product_name_en) || t("unnamed");
  const ingr = (LANG === "en" ? p.ingredients_text_en || p.ingredients_text || p.ingredients_text_ro : p.ingredients_text_ro || p.ingredients_text || p.ingredients_text_en) || "";
  let adds = null;
  if((p.additives_tags||[]).length) adds = fromTags(p.additives_tags);
  if(ingr){ const ex = extractFromText(ingr); adds = adds ? mergeAdds(adds, ex) : ex; }
  const sc = computeScore(p, adds);
  if(!quiet) cur.g = +p.serving_quantity > 0 ? +p.serving_quantity : 100;
  cur.ctx = {adds, text:norm(ingr), nutr:p.nutriments, allergens:p.allergens_tags, traces:p.traces_tags, analysis:p.ingredients_analysis_tags};
  const me = personalize(cur.ctx, cur.g);
  const report = `<a href="https://world.openfoodfacts.org/product/${esc(code)}" target="_blank" rel="noopener">${esc(t("reportLink"))}</a>`;
  $("#result").innerHTML = `
    <div class="product">
      ${p.image_front_small_url ? `<img src="${esc(p.image_front_small_url)}" alt="">` : ""}
      <div><h3>${esc(name)}</h3><p>${esc([p.brands, p.quantity].filter(Boolean).join(", "))}</p><p>${esc(t("codeLbl",{c:code}))}</p></div>
    </div>
    ${scoreBlock(sc, me)}
    ${alertsBlock(me)}
    ${additivesBlock(adds, me.mine)}
    ${portionBlock(p, cur.g)}
    ${lightsBlock(p.nutriments)}
    ${ingr ? `<details class="ingr"><summary>${esc(t("ingredients"))}</summary><p>${esc(ingr)}</p></details>` : ""}
    ${FOOT()}
    <p class="foot">${esc(t("report")).replace("{link}", report)}</p>`;
  if(quiet) return;
  saveHistory({code, name, brand:p.brands||"", img:p.image_front_small_url||"", score:sc?sc.score:null, t:Date.now()});
  $("#result").scrollIntoView({behavior:"smooth", block:"start"});
}
function renderPasted(text, quiet){
  lastRender = () => renderPasted(text, true);
  const adds = extractFromText(text);
  const sc = computeScore({}, adds);
  cur.ctx = {adds, text:norm(text)};
  const me = personalize(cur.ctx, 100);
  $("#result").innerHTML = `
    <div class="product"><div><h3>${esc(t("pastedTitle"))}</h3><p>${esc(t("pastedSub"))}</p></div></div>
    ${scoreBlock(sc, me)}${alertsBlock(me)}${additivesBlock(adds, me.mine)}${FOOT()}`;
  if(!quiet) $("#result").scrollIntoView({behavior:"smooth", block:"start"});
}
const OCR_CTA = () => `<div class="row"><button class="btn violet small" data-ocr="1">${esc(t("ocrBtn"))}</button><button class="linkish" data-type="1">${esc(t("typeIt"))}</button></div>`;
function isInternal(code){ return /^2/.test(code) || (code.length === 13 && /^02/.test(code)); }
function renderInternal(code){
  lastRender = () => renderInternal(code);
  $("#result").innerHTML = `<div class="notice internal" style="margin-top:20px">
    <strong>${esc(t("internalTitle",{c:code}))}</strong>
    <p style="margin:6px 0 4px">${esc(t("internalP1"))}</p>
    <p style="margin:0 0 4px">${esc(t("internalP2"))}</p>
    ${OCR_CTA()}
  </div>`;
}
function renderNotFound(code){
  lastRender = () => renderNotFound(code);
  const link = `<a href="https://world.openfoodfacts.org/product/${esc(code)}" target="_blank" rel="noopener" style="color:var(--brand)">Open Food Facts</a>`;
  $("#result").innerHTML = `<div class="notice" style="margin-top:20px">
    <strong>${esc(t("notFoundTitle",{c:code}))}</strong>
    <p style="margin:6px 0 4px">${esc(t("notFoundP"))}</p>
    ${OCR_CTA()}
    <p class="hint">${esc(t("helpOthers")).replace("{link}", link)}</p>
  </div>`;
}

/* ---------- căutare produs ---------- */
const FIELDS = "allergens_tags,traces_tags,ingredients_analysis_tags,product_name,product_name_ro,product_name_en,brands,quantity,product_quantity,serving_quantity,serving_size,image_front_small_url,additives_tags,nutriscore_grade,nova_group,nutriments,ingredients_text,ingredients_text_ro,ingredients_text_en";
async function loadProduct(raw){
  const code = String(raw).replace(/\D/g,"");
  if(code.length < 8){ lastRender = null; $("#result").innerHTML = `<div class="notice">${esc(t("codeShort"))}</div>`; return; }
  $("#result").innerHTML = `<div class="spinner" role="status" aria-label="${esc(t("searching"))}"></div>`;
  const tries = [code];
  if(code.length === 12) tries.push("0"+code);
  if(code.length === 13 && code[0] === "0") tries.push(code.slice(1));
  try{
    for(const c of tries){
      const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${c}.json?fields=${FIELDS}`);
      if(r.status === 404) continue;
      if(!r.ok) throw new Error("HTTP "+r.status);
      const j = await r.json();
      if(j.status === 1 && j.product){ renderProduct(code, j.product); return; }
    }
    isInternal(code) ? renderInternal(code) : renderNotFound(code);
  }catch(e){
    lastRender = null;
    $("#result").innerHTML = `<div class="notice">${esc(t("netErr",{e:e.message}))}</div>`;
  }
}

/* ---------- citire etichetă cu camera (OCR, gratuit, în telefon) ---------- */
let ocrWorker = null, ocrLangLoaded = null, ocrBusy = false;
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("script")); document.head.appendChild(s); });
}
function ocrStatus(text, pct, err){
  const s = $("#ocrStatus"); s.hidden = false; s.classList.toggle("err", !!err);
  s.innerHTML = esc(text) + (pct != null ? `<div class="bar"><i style="width:${Math.round(pct*100)}%"></i></div>` : "");
}
function ocrLogger(m){
  if(m.status === "recognizing text") ocrStatus(t("ocrReading"), m.progress);
  else if(/traineddata/.test(m.status)) ocrStatus(t("ocrLang"), m.progress);
  else if(/initializ|loading/.test(m.status)) ocrStatus(t("ocrInit"), m.progress);
}
async function prepImage(file){
  const img = await createImageBitmap(file);
  const sc = Math.min(1, 2000/Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
  const x = c.getContext("2d");
  x.filter = "grayscale(1) contrast(1.4)";
  x.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function startOcr(){ stopScan(); $("#ocrFile").value = ""; $("#ocrFile").click(); }
function openTyping(){ $("#ocrBox").hidden = false; $("#ocrStatus").hidden = true; $("#pasteText").focus(); $("#ocrBox").scrollIntoView({behavior:"smooth", block:"center"}); }
async function runOcr(file){
  if(!file || ocrBusy) return;
  ocrBusy = true;
  $("#ocrBox").hidden = false; $("#pasteText").value = "";
  $("#ocrBox").scrollIntoView({behavior:"smooth", block:"start"});
  ocrStatus(t("ocrPrep"), 0);
  try{
    const canvas = await prepImage(file);
    if(!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
    const lang = LANG === "ro" ? "ron" : "eng";
    if(ocrWorker && ocrLangLoaded !== lang){ try{ await ocrWorker.terminate(); }catch(e){} ocrWorker = null; }
    if(!ocrWorker){ ocrWorker = await Tesseract.createWorker(lang, 1, {logger: ocrLogger}); ocrLangLoaded = lang; }
    const { data } = await ocrWorker.recognize(canvas);
    const text = fixOcr(data.text || "");
    if(text.length < 10){ ocrStatus(t("ocrNoText"), null, true); return; }
    $("#pasteText").value = text;
    ocrStatus(t("ocrDone"));
    renderPasted(text, true);
  }catch(e){
    ocrStatus(t("ocrErr",{e:e.message}), null, true);
  }finally{ ocrBusy = false; }
}

/* ---------- scanner coduri de bare ---------- */
let qr = null, scanning = false, hintTimer = null, zoomCap = null;
function parseScan(text){
  const s = String(text).trim();
  let m = s.match(/\/01\/(\d{14})/);
  if(!m) m = s.match(/\(01\)\s?(\d{14})/);
  if(!m) m = s.replace(/[\x1d\s]/g,"").match(/^\]?[A-Za-z]?\d?01(\d{14})/);
  if(m){ const g = m[1]; return g.startsWith("0") ? g.slice(1) : g; }
  const d = s.replace(/\D/g,"");
  return d.length === 14 && d.startsWith("0") ? d.slice(1) : d;
}
function ensureQr(){
  if(qr) return qr;
  const F = Html5QrcodeSupportedFormats;
  qr = new Html5Qrcode("reader", {
    formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.ITF,F.CODE_39,F.RSS_14,F.RSS_EXPANDED,F.QR_CODE,F.DATA_MATRIX],
    verbose:false, experimentalFeatures:{useBarCodeDetectorIfSupported:true}
  });
  return qr;
}
async function startScan(){
  if(typeof Html5Qrcode === "undefined"){ $("#result").innerHTML = `<div class="notice">${esc(t("scanLibErr"))}</div>`; return; }
  try{
    ensureQr();
    $("#idle").hidden = true;
    await qr.start({facingMode:"environment"}, {
        fps:15, disableFlip:true,
        videoConstraints:{facingMode:"environment", width:{ideal:1920}, height:{ideal:1080}, advanced:[{focusMode:"continuous"}]}
      }, onCode, () => {});
    scanning = true; $("#stopRow").hidden = false;
    $("#scanHint").textContent = t("scanHint");
    setupCamTools();
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { if(scanning) $("#scanHint").textContent = t("scanHintSlow"); }, 8000);
  }catch(e){
    $("#idle").hidden = false;
    $("#result").innerHTML = `<div class="notice">${esc(t("camErr"))}</div>`;
  }
}
function setupCamTools(){
  $("#torchBtn").hidden = true; $("#zoomBtn").hidden = true; zoomCap = null;
  try{
    const caps = qr.getRunningTrackCameraCapabilities();
    if(caps.torchFeature().isSupported()){ $("#torchBtn").hidden = false; $("#torchBtn").setAttribute("aria-pressed","false"); }
    const zoom = caps.zoomFeature();
    if(zoom.isSupported() && zoom.max() >= 2){ zoomCap = zoom; $("#zoomBtn").hidden = false; $("#zoomBtn").setAttribute("aria-pressed","false"); }
  }catch(e){}
}
async function toggleTorch(){
  try{
    const on = $("#torchBtn").getAttribute("aria-pressed") !== "true";
    await qr.getRunningTrackCameraCapabilities().torchFeature().apply(on);
    $("#torchBtn").setAttribute("aria-pressed", String(on));
  }catch(e){ $("#torchBtn").hidden = true; }
}
async function toggleZoom(){
  try{
    const on = $("#zoomBtn").getAttribute("aria-pressed") !== "true";
    await zoomCap.apply(on ? 2 : Math.max(1, zoomCap.min()));
    $("#zoomBtn").setAttribute("aria-pressed", String(on));
  }catch(e){ $("#zoomBtn").hidden = true; }
}
async function stopScan(){
  clearTimeout(hintTimer);
  if(qr && scanning){ try{ await qr.stop(); }catch(e){} }
  scanning = false; $("#stopRow").hidden = true; $("#idle").hidden = false;
}
async function onCode(text){
  if(!scanning) return;
  await stopScan();
  if(navigator.vibrate) navigator.vibrate(60);
  const code = parseScan(text);
  $("#manualCode").value = code;
  loadProduct(code);
}
async function scanPhoto(file){
  if(!file) return;
  if(typeof Html5Qrcode === "undefined"){ $("#result").innerHTML = `<div class="notice">${esc(t("scanLibErr"))}</div>`; return; }
  await stopScan();
  $("#result").innerHTML = `<div class="spinner" role="status" aria-label="${esc(t("photoSearching"))}"></div>`;
  try{
    const code = parseScan(await ensureQr().scanFile(file, false));
    $("#manualCode").value = code;
    loadProduct(code);
  }catch(e){
    lastRender = null;
    $("#result").innerHTML = `<div class="notice">${esc(t("photoNoCode"))}</div>`;
  }
}

/* ---------- istoric ---------- */
const HK = "good2eat.history";
function getHistory(){ try{ return JSON.parse(localStorage.getItem(HK)) || []; }catch(e){ return []; } }
function saveHistory(item){
  try{ const h = getHistory().filter(x => x.code !== item.code); h.unshift(item); localStorage.setItem(HK, JSON.stringify(h.slice(0,60))); }catch(e){}
}
function renderHistory(){
  const h = getHistory();
  if(!h.length){ $("#histList").innerHTML = `<div class="notice">${esc(t("histEmpty"))}</div>`; return; }
  $("#histList").innerHTML = h.map(x => {
    const v = x.score == null ? null : verdict(x.score);
    const st = v ? VSTYLE[v.i].replace(/--vc:([^;]+);--vt:([^;]+).*/,"background:$1;color:$2") : "color:var(--muted)";
    return `<button class="hitem" data-code="${esc(x.code)}">
      ${x.img ? `<img src="${esc(x.img)}" alt="">` : `<span class="ph"></span>`}
      <span class="t"><b>${esc(x.name)}</b><span>${esc(x.brand || x.code)}</span></span>
      <span class="badge" style="${st}">${x.score ?? "–"}</span>
    </button>`;
  }).join("") + `<button class="linkish" id="clearHist">${esc(t("histClear"))}</button>`;
}

/* ---------- lista de aditivi ---------- */
let filt = "all";
function renderAddList(){
  const q = norm($("#addSearch").value.trim());
  const list = DB.filter(a => (filt === "all" || String(a.l) === filt) &&
    (!q || norm(a.c).includes(q) || norm(L(a).n).includes(q) || norm(a.n).includes(q) || (a.k||[]).some(k => k.includes(q)) || norm(L(a).t).includes(q)));
  $("#addCount").textContent = t("addCount",{n:list.length});
  $("#addList").innerHTML = list.map(a => addItem(a)).join("");
}

/* ---------- profil (interfață) ---------- */
function renderProfilePill(){
  const Lb = profileLabels(getProfile()), p = $("#profPill");
  p.classList.toggle("off", !Lb.length);
  p.textContent = Lb.length ? t("pillOn",{list:Lb.join(", ")}) : t("pillOff");
}
function segHtml(key, opts, val){
  return opts.map(([v,k]) => `<button role="radio" aria-checked="${v===val}" data-key="${key}" data-val="${v}">${esc(t(k))}</button>`).join("");
}
function renderProfile(){
  const P = getProfile();
  $("#kidSeg").innerHTML = segHtml("kidAge", KID_OPTS, P.kidAge);
  $("#sportSeg").innerHTML = segHtml("sport", SPORT_OPTS, P.sport);
  $("#condList").innerHTML = CONDS.map(id =>
    `<label class="tog"><span>${esc(t("c_"+id))}<small>${esc(t("c_"+id+"_d"))}</small></span><input type="checkbox" data-c="${id}" ${P[id]?"checked":""}></label>`).join("");
  $("#allergenList").innerHTML = ALLERGENS.map(([id,k]) =>
    `<button class="chip" data-a="${id}" aria-pressed="${P.allergens.includes(id)}">${esc(t(k))}</button>`).join("");
}

/* ---------- aplicarea limbii pe interfață ---------- */
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
  renderProfilePill();
  if($("#v-prof").classList.contains("on")) renderProfile();
  if($("#v-hist").classList.contains("on")) renderHistory();
  if($("#v-add").classList.contains("on")) renderAddList();
  if(scanning) $("#scanHint").textContent = t("scanHint");
  if(lastRender) lastRender();
}
function setLang(l){ LANG = l; try{ localStorage.setItem(LK, l); }catch(e){} applyLang(); }

/* ---------- navigare și evenimente ---------- */
function show(v){
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === v));
  document.querySelectorAll("nav.tabs button").forEach(b => {
    if(b.dataset.v === v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  if(v !== "v-scan") stopScan();
  if(v === "v-hist") renderHistory();
  if(v === "v-add") renderAddList();
  if(v === "v-prof") renderProfile();
  if(v === "v-scan"){ renderProfilePill(); if(lastRender) lastRender(); }
  window.scrollTo(0,0);
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.v)));
$("#startBtn").addEventListener("click", startScan);
$("#stopBtn").addEventListener("click", stopScan);
$("#torchBtn").addEventListener("click", toggleTorch);
$("#zoomBtn").addEventListener("click", toggleZoom);
$("#photoCode").addEventListener("click", () => { $("#codeFile").value = ""; $("#codeFile").click(); });
$("#codeFile").addEventListener("change", e => scanPhoto(e.target.files[0]));
$("#manualForm").addEventListener("submit", e => { e.preventDefault(); stopScan(); loadProduct($("#manualCode").value); });
$("#ocrBtn").addEventListener("click", startOcr);
$("#ocrAgain").addEventListener("click", startOcr);
$("#ocrFile").addEventListener("change", e => runOcr(e.target.files[0]));
$("#typeToggle").addEventListener("click", openTyping);
$("#pasteBtn").addEventListener("click", () => { const s = $("#pasteText").value.trim(); if(s) renderPasted(s); });
$("#result").addEventListener("click", e => {
  if(e.target.closest("[data-ocr]")) return startOcr();
  if(e.target.closest("[data-type]")) return openTyping();
  if(e.target.closest("[data-method]")){ show("v-add"); $("#method").open = true; return; }
  const q = e.target.closest(".qbtn"); if(q) updatePortion(+q.dataset.g);
});
$("#result").addEventListener("input", e => {
  if(e.target.id === "grams") updatePortion(parseFloat(String(e.target.value).replace(",", ".")), true);
});
$("#histList").addEventListener("click", e => {
  if(e.target.id === "clearHist"){ try{ localStorage.removeItem(HK); }catch(_){} renderHistory(); return; }
  const it = e.target.closest(".hitem"); if(it){ show("v-scan"); $("#manualCode").value = it.dataset.code; loadProduct(it.dataset.code); }
});
$("#addSearch").addEventListener("input", renderAddList);
document.querySelectorAll(".chips:not(.al) .chip").forEach(c => c.addEventListener("click", () => {
  filt = c.dataset.f;
  document.querySelectorAll(".chips:not(.al) .chip").forEach(x => x.setAttribute("aria-pressed", x === c ? "true" : "false"));
  renderAddList();
}));
$("#profPill").addEventListener("click", () => show("v-prof"));
["#kidSeg","#sportSeg"].forEach(id => $(id).addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const P = getProfile(); P[b.dataset.key] = b.dataset.val; setProfile(P); renderProfile();
}));
$("#condList").addEventListener("change", e => {
  const id = e.target.dataset.c; if(!id) return;
  const P = getProfile(); P[id] = e.target.checked; setProfile(P);
});
$("#allergenList").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  const P = getProfile(); const set = new Set(P.allergens);
  set.has(b.dataset.a) ? set.delete(b.dataset.a) : set.add(b.dataset.a);
  P.allergens = [...set]; setProfile(P);
  b.setAttribute("aria-pressed", set.has(b.dataset.a));
});
$("#profDone").addEventListener("click", () => show("v-scan"));
$("#profReset").addEventListener("click", () => { setProfile({allergens:[]}); renderProfile(); });

$(".barcode-art").innerHTML = [3,1,2,1,4,1,1,3,2,1,1,2,3,1,2,4,1,2,1,3,1,1,2].map(w => `<i style="width:${w}px"></i>`).join("");
applyLang();
const qp = new URLSearchParams(location.search).get("cod") || new URLSearchParams(location.search).get("code");
if(qp){ $("#manualCode").value = qp; loadProduct(qp); }
</script>
